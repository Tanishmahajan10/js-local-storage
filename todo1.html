<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <link rel="stylesheet" href="todo1.css">
</head>
<body>
  <main class="app">
    <h1>My Todos</h1>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <ul id="todo-list"></ul>
    <p id="empty-msg" class="empty">No tasks yet. Add your first one above.</p>

    <footer>
      <span id="count"></span>
      <button id="clear-done" type="button">Delete All</button>
    </footer>
  </main>

  <script src="todo1.js"></script>
</body>
</html>
